; Custom PJSIP transport settings for the GCP FreePBX image.
; This file is copied to /etc/asterisk/pjsip.transports_custom.conf only when absent.
;
; Example for a public GCP address:
; [0.0.0.0-udp]
; type=transport
; protocol=udp
; bind=0.0.0.0:5060
; external_signaling_address=PBX_PUBLIC_IP_OR_DNS
; external_media_address=PBX_PUBLIC_IP_OR_DNS
;
; Set the public address only when NAT requires it. Do not duplicate a transport
; already generated by FreePBX.
