; Custom dialplan for the GCP FreePBX image.
; This file is copied to /etc/asterisk/extensions_custom.conf only when absent.
; Add custom contexts/extensions here instead of editing generated extensions.conf.
;
; Example:
; [from-internal-custom]
; exten => 700,1,Answer()
; same => n,Playback(hello-world)
; same => n,Hangup()
