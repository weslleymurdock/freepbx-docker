; Custom PJSIP configuration for the GCP FreePBX image.
; This file is copied to /etc/asterisk/pjsip_custom.conf only when that file does not exist.
; Prefer FreePBX custom include files instead of editing generated pjsip.conf directly.
;
; SIP realm example:
[global]
type=global
default_realm=*
;
; Endpoint/auth-specific realm example:
; [my-auth]
; type=auth
; auth_type=userpass
; username=example
; password=change-me
; realm=pbx.example.com
