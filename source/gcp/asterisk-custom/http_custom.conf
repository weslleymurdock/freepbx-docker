; Custom Asterisk HTTP server settings.
; This file is copied to /etc/asterisk/http_custom.conf only when absent.
;
; Example for the Asterisk HTTP/WebSocket service:
; enabled=yes
; bindaddr=0.0.0.0
; bindport=8088
;
; Do not enable HTTP/WebSocket here unless the corresponding FreePBX/PJSIP
; configuration is also intended to use it.
