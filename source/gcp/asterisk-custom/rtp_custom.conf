; Custom RTP settings for the GCP FreePBX image.
; This file is copied to /etc/asterisk/rtp_custom.conf only when that file does not exist.
; FreePBX/Asterisk generated files should not be edited directly.
;
; Example:
; rtpstart=10000
; rtpend=20000
; strictrtp=yes
; icesupport=no

; Keep this file intentionally empty by default so FreePBX retains control of generated RTP settings.
